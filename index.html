<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Convert Retard Units to Metrics!</title>
    </head>
    <body>
        <section id="main">
            <h1>Retard Unit Converter</h1>
            <section id="converter-group">
                <!-- Here the converters (input-field for the retard unit with its corresponding output-field) are rendered (main.js: initializeConverters() ) -->
            </section>
            <button id="open-checkboxes-btn">More Retards here &darr;</button>
            <fieldset id="checkbox-group" style="display: none">
                <!-- Here the list of checkboxes for activating/deactivating individual converters is generated (main.js: initializeCheckboxes() ) -->
            </fieldset>
        </section>
        <script src="main.js"></script>
    </body>
</html>
